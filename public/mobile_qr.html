<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Fielder · 현장 불편 접수</title>
  <link rel="stylesheet" href="/assets/app.css">
  <script src="/assets/ui-enhance.min.js"></script>
  <style>
    body { font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #F5F4F2; }
  </style>
</head>
<body class="min-h-[100dvh] flex flex-col items-center justify-center sm:p-4">
  <div class="w-full max-w-[440px] min-h-[100dvh] sm:min-h-0 sm:h-[780px] bg-white sm:rounded-[32px] sm:border border-[#E5E7EB] sm:shadow-xl flex flex-col overflow-hidden">
    <header class="bg-[#002B41] text-white px-4 py-3.5 flex items-center justify-center relative shrink-0">
      <span class="absolute left-4 min-w-[36px] h-8 px-2.5 rounded-lg bg-gradient-to-br from-[#13B5EA] to-[#0084B4] text-white font-black text-xs flex items-center justify-center">Fielder</span>
      <div class="text-center pl-14 pr-2">
        <div id="qr-company-title" class="text-xs text-[#B8D9E8] font-semibold">현장 시설관리</div>
        <div class="text-base font-extrabold tracking-tight">현장 불편 접수</div>
      </div>
    </header>

    <div id="view-qr" class="flex-1 flex flex-col overflow-hidden bg-white">
      <div class="px-5 py-3.5 border-b border-[#EDECEB]">
        <span class="text-xs text-[#F06A6A] font-semibold">시설 정비 및 불편 접수 위치</span>
        <select id="qr-target-location" class="w-full text-base font-bold text-[#1E1F21] bg-transparent outline-none mt-0.5"></select>
      </div>

      <div class="flex-1 overflow-y-auto p-4 space-y-4 text-sm">
        <div>
          <span class="block text-xs text-[#6D6E6F] mb-1.5 font-medium">불편 유형 선택</span>
          <select id="qr-category-select" class="w-full h-11 border border-[#EDECEB] rounded-xl px-3 text-sm bg-white outline-none font-medium">
            <option value="FACILITY">시설/영선보수 (수전, 배관, 문고리 고장)</option>
            <option value="CLEANING">환경/미화청결 (바닥 오염, 쓰레기 방치)</option>
            <option value="SECURITY">보안/안전 (출입문, 주차 장애, 비상구)</option>
            <option value="ELECTRIC">전기/기계설비 (조명 깜빡임, 콘센트)</option>
            <option value="ELEVATOR">승강기/특수 (버튼 불량, 소음)</option>
          </select>
        </div>

        <div class="bg-[#FAF9F8] p-3.5 rounded-xl border border-[#EDECEB] space-y-2.5">
          <div class="flex justify-between items-center">
            <span class="font-semibold text-[#1E1F21] text-[13px]">휴대폰 문자 인증</span>
            <span id="sms-badge" class="text-xs text-[#6D6E6F]">인증 대기</span>
          </div>
          <div class="flex space-x-1.5">
            <input type="tel" id="sms-phone" oninput="resetSmsVerification()" placeholder="휴대폰 번호 (예: 010-1234-5678)" class="flex-1 h-10 border border-[#EDECEB] bg-white rounded-lg px-3 text-sm outline-none">
            <button type="button" onclick="sendSmsOtp()" class="px-3 h-10 bg-[#1E1F21] text-white rounded-lg text-xs font-semibold whitespace-nowrap">인증번호 전송</button>
          </div>
          <div id="otp-group" class="hidden flex space-x-1.5 pt-1">
            <input type="text" maxlength="6" id="sms-otp" placeholder="인증번호 6자리" class="flex-1 h-10 border border-[#EDECEB] bg-white rounded-lg px-3 text-sm outline-none">
            <button type="button" onclick="verifySmsOtp()" class="px-3.5 h-10 bg-[#34A853] text-white rounded-lg text-xs font-semibold whitespace-nowrap">확인</button>
          </div>
        </div>

        <div>
          <div class="flex items-center justify-between mb-1.5">
            <span class="block text-xs text-[#6D6E6F] font-medium">현장 사진 촬영 / 첨부</span>
            <button type="button" id="btn-clear-qr-photo" onclick="clearQrPhoto()" class="hidden text-xs font-bold text-[#F06A6A] hover:underline">첨부 삭제</button>
          </div>
          <div id="dropzone-qr-photo" onclick="simulateReportPhoto()" class="border border-dashed border-[#EDECEB] rounded-xl p-4 text-center bg-[#FAF9F8] hover:border-[#13B5EA] cursor-pointer text-sm transition">
            <div class="font-medium text-[#1E1F21]" id="qr-photo-status">사진 촬영 / 추가 (클릭 또는 드래그)</div>
          </div>
        </div>

        <div>
          <span class="block text-xs text-[#6D6E6F] mb-1.5 font-medium">신고 제목</span>
          <input type="text" id="qr-title" class="w-full h-11 border border-[#EDECEB] rounded-xl px-3 text-sm outline-none mb-2.5" placeholder="예: 세면대 물이 전혀 안 나옴">
          <span class="block text-xs text-[#6D6E6F] mb-1.5 font-medium">상세 내용</span>
          <textarea id="qr-desc" rows="3" class="w-full border border-[#EDECEB] rounded-xl p-3 text-sm outline-none" placeholder="고장 및 불편 사항을 입력하세요"></textarea>
        </div>

        <div id="qr-submit-result" class="hidden p-3.5 rounded-xl bg-emerald-50 border border-emerald-200 text-emerald-800 text-xs space-y-1"></div>
      </div>

      <div class="p-4 border-t border-[#EDECEB] bg-white sticky bottom-0">
        <button id="btn-submit-qr-ticket" type="button" onclick="submitQrTicket()" class="w-full py-3.5 bg-[#1E1F21] hover:bg-black text-white rounded-xl font-bold text-sm shadow-md">
          정비 요청 접수하기
        </button>
      </div>
    </div>
  </div>
  <script src="/assets/mobile-qr.min.js"></script>
</body>
</html>
