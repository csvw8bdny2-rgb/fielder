<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>현장 정비 및 불편 접수 - Fieldon</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <meta name="apple-mobile-web-app-title" content="Fieldon 현장앱">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <link rel="stylesheet" href="/assets/app.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700;800;900&display=swap">
  <script src="/ui-enhance.js"></script>
  <style>
    body { font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    .btn-sky {
      background-color: #13B5EA;
      color: #002B41;
      font-weight: 800;
      transition: all 0.15s ease-in-out;
    }
    .btn-sky:hover {
      background-color: #0EA5E9;
      color: #001F30;
    }
    .btn-sky:disabled {
      background-color: #CBD5E1;
      color: #64748B;
      cursor: not-allowed;
    }
  </style>
</head>
<body class="bg-[#F8FAFC] min-h-screen flex flex-col justify-between antialiased text-[#0F172A]">

  <!-- 1. 상단 바 (좌측 로고 + 중앙 현장 불편 접수) -->
  <header class="w-full bg-[#002B41] border-b border-[#001F30] py-3.5 px-4 text-white sticky top-0 z-30 shadow-md">
    <div class="max-w-md mx-auto relative flex items-center justify-center min-h-[36px]">
      <span id="report-header-logo" class="absolute left-0 flex items-center shrink-0">
        <img src="/assets/brand/fieldon-horizontal-dark.svg" alt="Fieldon" class="h-7 w-auto">
      </span>
      <span class="font-extrabold text-[22px] sm:text-2xl leading-none text-white tracking-tight whitespace-nowrap text-center">현장 불편 접수</span>
    </div>
  </header>

  <!-- 2. 초간결 원페이지 신고 폼 -->
  <main class="flex-1 max-w-md w-full mx-auto px-4 py-5 space-y-4">

    <!-- 📍 1. 접수 위치 -->
    <div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-xs space-y-2">
      <span class="text-base font-extrabold text-[#002B41] block">접수 위치</span>
      <div class="flex items-center space-x-2 pt-0.5">
        <span class="text-xl">📍</span>
        <span id="display-location-name" class="text-lg font-extrabold text-[#1E1F21] tracking-tight">
          위치 확인 중...
        </span>
      </div>
      <input type="hidden" id="report-location-id" value="">
    </div>

    <!-- 📸 2. 현장 사진 (선택) -->
    <div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-xs space-y-2.5">
      <span class="text-base font-extrabold text-[#002B41] block">현장 사진 <span class="text-sm font-medium text-slate-500">(선택)</span></span>
      
      <label class="cursor-pointer block border-2 border-dashed border-slate-200 hover:border-[#13B5EA] rounded-xl p-4 text-center bg-slate-50 transition">
        <div class="flex flex-col items-center justify-center space-y-1.5">
          <span class="text-2xl">📷</span>
          <span class="text-sm font-bold text-slate-700">사진 촬영 또는 앨범에서 선택</span>
        </div>
        <input type="file" id="photo-input" accept="image/*" capture="environment" onchange="handlePhoto(this)" class="hidden">
      </label>

      <!-- 사진 미리보기 -->
      <div id="photo-preview-wrap" class="hidden relative pt-1">
        <img id="photo-preview-img" src="" alt="첨부 사진" class="w-full h-44 object-cover rounded-xl border border-slate-200">
        <button type="button" onclick="clearPhoto()" class="absolute top-3 right-3 bg-black/70 hover:bg-black text-white rounded-full w-8 h-8 flex items-center justify-center text-sm font-bold">
          ✕
        </button>
      </div>
    </div>

    <!-- ✏️ 3. 불편 및 요청 사항 (내용 길이에 따라 자동 확장) -->
    <div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-xs space-y-2.5">
      <span class="text-base font-extrabold text-[#002B41] block">불편 및 요청 사항</span>
      <textarea id="report-comment" rows="3" oninput="autoResizeReportComment(this)" placeholder="불편하거나 정비가 필요한 내용을 적어주세요." class="w-full min-h-[96px] border border-slate-300 rounded-xl p-3.5 text-[15px] font-medium outline-none focus:border-[#13B5EA] bg-white resize-none overflow-hidden leading-relaxed"></textarea>
    </div>

    <!-- 📱 4. 휴대폰 번호 (010 + 8자리 숫자) & 인증번호 -->
    <div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-xs space-y-3">
      <div class="flex items-center justify-between">
        <span class="text-base font-extrabold text-[#002B41]">휴대폰 번호</span>
        <span id="badge-verified" class="hidden px-2.5 py-0.5 rounded text-xs font-bold bg-emerald-50 text-emerald-700 border border-emerald-200">
          인증 완료
        </span>
      </div>

      <!-- 전화번호 입력 및 인증 요청 -->
      <div class="flex items-center space-x-2">
        <input type="tel" id="input-phone" oninput="formatMobilePhoneInput(this)" inputmode="numeric" maxlength="13" placeholder="010-0000-0000" class="flex-1 h-12 border border-slate-300 rounded-xl px-3.5 text-sm font-semibold outline-none focus:border-[#13B5EA] bg-white">
        <button type="button" id="btn-send-code" onclick="sendCode()" class="h-12 px-4 bg-[#002B41] hover:bg-[#001F30] text-white font-bold text-sm rounded-xl whitespace-nowrap transition">
          인증번호 받기
        </button>
      </div>

      <!-- 인증번호 입력창 -->
      <div id="code-verify-box" class="hidden flex items-center space-x-2 pt-1">
        <input type="text" id="input-code" inputmode="numeric" placeholder="인증번호 6자리" maxlength="6" class="flex-1 h-12 border border-slate-300 rounded-xl px-3.5 text-sm font-mono font-bold outline-none focus:border-[#13B5EA] bg-white">
        <button type="button" onclick="verifyCode()" class="h-12 px-5 bg-[#13B5EA] hover:bg-[#0EA5E9] text-[#002B41] font-bold text-sm rounded-xl whitespace-nowrap transition">
          확인
        </button>
      </div>
    </div>

    <!-- 🚀 5. 접수하기 버튼 -->
    <div class="pt-1 pb-4">
      <button type="button" id="btn-submit" onclick="submitReport()" class="btn-sky w-full h-12 rounded-xl text-[15px] flex items-center justify-center shadow-md">
        접수 완료하기
      </button>
    </div>

  </main>

  <!-- 3. 푸터 -->
  <footer class="w-full bg-white border-t border-slate-200 py-3 px-4 text-center text-xs text-slate-500">
    <div class="max-w-md mx-auto">
      <div>© Fieldon 시설관리시스템</div>
    </div>
  </footer>

  <!-- ================= 접수 완료 팝업 ================= -->
  <div id="modal-success" class="fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4 hidden backdrop-blur-xs">
    <div class="bg-white rounded-3xl max-w-sm w-full p-6 text-center space-y-4 shadow-2xl">
      <div class="w-14 h-14 bg-emerald-50 text-emerald-600 rounded-full flex items-center justify-center mx-auto text-2xl font-black border border-emerald-200">
        ✓
      </div>

      <div class="space-y-1">
        <h3 class="text-lg font-bold text-slate-900">접수가 완료되었습니다</h3>
      </div>

      <div class="bg-slate-50 border border-slate-200 rounded-xl p-3.5 text-left text-sm space-y-1.5">
        <div class="flex justify-between">
          <span class="text-slate-500">접수 번호</span>
          <span class="font-mono font-bold text-slate-800" id="res-ticket-no">T-2026-0000</span>
        </div>
        <div class="flex justify-between">
          <span class="text-slate-500">접수 위치</span>
          <span class="font-bold text-slate-800" id="res-location-name">-</span>
        </div>
        <div class="flex justify-between">
          <span class="text-slate-500">연락처</span>
          <span class="font-mono text-[#0084B4]" id="res-phone">-</span>
        </div>
      </div>

      <button onclick="location.reload()" class="btn-sky w-full h-12 rounded-xl text-sm">
        확인
      </button>
    </div>
  </div>

  <script>
    function getTenantParam() {
      return new URLSearchParams(window.location.search).get('tenant') || '';
    }
    (function() {
      const origFetch = window.fetch;
      window.fetch = function(input, init) {
        const tenant = getTenantParam();
        if (tenant && typeof input === 'string' && input.startsWith('/api/') && !input.includes('tenant=')) {
          const sep = input.includes('?') ? '&' : '?';
          input = input + sep + 'tenant=' + encodeURIComponent(tenant);
        }
        return origFetch.call(this, input, init);
      };
    })();

    let photoBase64 = null;
    let isVerified = false;
    let verifiedPhone = '';
    let qrVerifyToken = '';
    let targetLocationObj = null;

    // 1. 초기 위치 및 회사 정보 자동 로드 (공개 API 사용)
    async function init() {
      const params = new URLSearchParams(window.location.search);
      const tenant = params.get('tenant') || '';
      const locId = params.get('location') || params.get('locId') || '';
      const locName = params.get('loc') || '';
      const locFloor = params.get('floor') || '';
      const locBldg = params.get('bldg') || '';

      // 회사 정보
      if (tenant) {
        try {
          const res = await fetch(`/api/public/company?tenant=${encodeURIComponent(tenant)}`);
          if (res.ok) {
            const data = await res.json();
            const compEl = document.getElementById('report-company-name');
            if (compEl && data.name) compEl.innerText = data.name;
            const logoEl = document.getElementById('report-header-logo');
            if (logoEl && data.logo_url) logoEl.innerText = data.logo_url;
          }
        } catch (e) {}
      }

      // 구역 목록 조회 (공개 API - QR locId 전달)
      try {
        const locParamQs = locId ? `&locId=${encodeURIComponent(locId)}` : '';
        const res = await fetch(`/api/public/locations?tenant=${encodeURIComponent(tenant)}${locParamQs}`);
        const locs = res.ok ? await res.json() : [];

        // 1) locId로 매칭
        if (locId) {
          targetLocationObj = locs.find(l => l.id === locId);
        }
        // 2) 이름과 층수로 매칭
        if (!targetLocationObj && locName) {
          targetLocationObj = locs.find(l => l.name === locName && (!locFloor || l.floor === locFloor));
        }
        // 3) 기본 첫 번째 구역
        if (!targetLocationObj && locs.length > 0) {
          targetLocationObj = locs[0];
        }

        if (targetLocationObj) {
          document.getElementById('report-location-id').value = targetLocationObj.id;
          document.getElementById('display-location-name').innerText = `${targetLocationObj.building || ''} ${targetLocationObj.floor || ''} ${targetLocationObj.name}`.trim();
        } else if (locName) {
          document.getElementById('display-location-name').innerText = `${locBldg} ${locFloor} ${locName}`.trim();
        } else {
          document.getElementById('display-location-name').innerText = '현장 공용 구역';
        }
      } catch (e) {
        document.getElementById('display-location-name').innerText = locName ? `${locFloor} ${locName}`.trim() : '현장 구역';
      }
    }

    function autoResizeReportComment(el) {
      if (!el) return;
      el.style.height = 'auto';
      el.style.height = Math.max(96, el.scrollHeight) + 'px';
    }

    // 2. 사진 처리 (클라이언트 리사이징 & WebP/JPEG 압축)
    async function handlePhoto(input) {
      if (!input.files || !input.files[0]) return;
      const file = input.files[0];
      if (window.compressImageFile) {
        try {
          const res = await window.compressImageFile(file, { maxWidth: 1280, maxHeight: 1280, quality: 0.78 });
          photoBase64 = res.dataUrl;
          document.getElementById('photo-preview-img').src = photoBase64;
          document.getElementById('photo-preview-wrap').classList.remove('hidden');
          return;
        } catch (e) {}
      }
      const reader = new FileReader();
      reader.onload = function(e) {
        photoBase64 = e.target.result;
        document.getElementById('photo-preview-img').src = photoBase64;
        document.getElementById('photo-preview-wrap').classList.remove('hidden');
      };
      reader.readAsDataURL(file);
    }

    function clearPhoto() {
      photoBase64 = null;
      document.getElementById('photo-input').value = '';
      document.getElementById('photo-preview-wrap').classList.add('hidden');
    }

    function showReportToast(msg, isError = false) {
      let el = document.getElementById('report-toast');
      if (!el) {
        el = document.createElement('div');
        el.id = 'report-toast';
        document.body.appendChild(el);
      }
      el.textContent = msg;
      el.className = `fixed bottom-5 left-1/2 -translate-x-1/2 z-50 px-4 py-2.5 rounded-xl shadow-lg text-xs font-bold text-white whitespace-nowrap max-w-[90vw] truncate ${isError ? 'bg-red-600' : 'bg-[#002B41]'}`;
      el.classList.remove('hidden');
      clearTimeout(window._reportToastTimer);
      window._reportToastTimer = setTimeout(() => el.classList.add('hidden'), 3200);
    }

    // 3. 인증번호 발송
    async function sendCode() {
      const phone = document.getElementById('input-phone').value.trim();
      if (!/^010-\d{4}-\d{4}$/.test(phone)) {
        showReportToast('휴대폰 번호는 010-0000-0000 형식으로 입력해주세요.', true);
        return;
      }

      try {
        const res = await fetch('/api/auth/sms/send', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ phone, tenant: getTenantParam() })
        });
        const data = await res.json();
        if (!res.ok) {
          showReportToast(data.message || data.error || '발송에 실패했습니다.', true);
          return;
        }

        document.getElementById('code-verify-box').classList.remove('hidden');
        document.getElementById('btn-send-code').textContent = '재발송';

        if (data.code) {
          document.getElementById('input-code').value = data.code;
          showReportToast(`인증번호 [${data.code}]가 입력되었습니다. [확인]을 눌러주세요.`);
        } else {
          showReportToast('인증번호 6자리가 발송되었습니다.');
        }
      } catch (e) {
        showReportToast('발송 실패: ' + e.message, true);
      }
    }

    // 4. 인증번호 확인
    async function verifyCode() {
      const phone = document.getElementById('input-phone').value.trim();
      const code = document.getElementById('input-code').value.trim();
      if (!code) return showReportToast('인증번호 6자리를 입력해주세요.', true);

      try {
        const res = await fetch('/api/auth/sms/verify', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ phone, otp: code, code, tenant: getTenantParam() })
        });
        const data = await res.json();

        if (res.ok) {
          isVerified = true;
          verifiedPhone = phone;
          qrVerifyToken = data.verification_token || '';

          document.getElementById('badge-verified').classList.remove('hidden');
          document.getElementById('code-verify-box').classList.add('hidden');
          document.getElementById('input-phone').readOnly = true;
          document.getElementById('btn-send-code').textContent = '인증완료';
          document.getElementById('btn-send-code').className = 'h-11 px-3.5 bg-emerald-600 text-white font-semibold text-xs rounded-xl';
          showReportToast('본인 확인이 완료되었습니다.');
        } else {
          showReportToast(data.message || '인증번호가 일치하지 않습니다.', true);
        }
      } catch (e) {
        showReportToast('오류: ' + e.message, true);
      }
    }

    // 5. 간편 신고 접수
    async function submitReport() {
      const comment = document.getElementById('report-comment').value.trim();
      const phone = document.getElementById('input-phone').value.trim();
      const locId = document.getElementById('report-location-id').value;
      const locDisplayName = document.getElementById('display-location-name').innerText;

      if (!comment && !photoBase64) {
        showReportToast('불편 내용을 적거나 현장 사진을 첨부해주세요.', true);
        document.getElementById('report-comment').focus();
        return;
      }

      if (!phone) {
        showReportToast('휴대폰 번호를 입력해주세요.', true);
        document.getElementById('input-phone').focus();
        return;
      }

      if (!isVerified) {
        showReportToast('휴대폰 인증을 먼저 완료해주세요.', true);
        return;
      }

      const btn = document.getElementById('btn-submit');
      btn.disabled = true;
      btn.textContent = '신고 접수 중...';

      try {
        const res = await fetch('/api/tickets/qr', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            location_id: locId || '',
            category: 'FACILITY',
            title: comment ? (comment.length > 30 ? comment.substring(0, 30) + '...' : comment) : '현장 사진 민원 접수',
            description: comment,
            phone: verifiedPhone,
            reporter_phone: verifiedPhone,
            qr_verify_token: qrVerifyToken,
            photo_url: photoBase64,
            tenant: getTenantParam()
          })
        });

        const data = await res.json();
        if (res.ok) {
          document.getElementById('res-ticket-no').textContent = data.ticket_no || 'T-접수완료';
          document.getElementById('res-location-name').textContent = locDisplayName;
          document.getElementById('res-phone').textContent = verifiedPhone;

          document.getElementById('modal-success').classList.remove('hidden');
        } else {
          showReportToast('접수 실패: ' + (data.error || '잠시 후 다시 시도해주세요.'), true);
        }
      } catch (e) {
        showReportToast('서버 통신 오류: ' + e.message, true);
      } finally {
        btn.disabled = false;
        btn.textContent = '불편 신고 접수하기';
      }
    }

    init();
  </script>
</body>
</html>
