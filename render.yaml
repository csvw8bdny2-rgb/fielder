services:
  - type: web
    name: fielder
    runtime: node
    plan: free
    autoDeploy: true
    buildCommand: npm install
    startCommand: node server.js
    # Render Starter 이상 플랜에서 아래 Disk 마운트 시 배포/재시작 시에도 SQLite DB 영구 보존
    # disk:
    #   name: fielder-db
    #   mountPath: /var/data
    #   sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: 22.14.0
      - key: SEED_DEMO
        value: "false"
      - key: DEMO_USER_PASSWORD
        sync: false
      - key: SUPER_ADMIN_EMAIL
        sync: false
      - key: SUPER_ADMIN_PASSWORD
        sync: false
      - key: MESSAGE_PROVIDER
        value: "mock"
